<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Socios - Ateneo</title>
    <!-- Modern Web Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Validador de <span>Socios</span></h1>
            <p>Sube el archivo CSV para procesar y filtrar los correos electrónicos.</p>
        </header>

        <main class="glass-card">
            <!-- Zona para arrastrar o seleccionar el archivo CSV -->
            <div id="drop-zone" class="drop-zone">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p>Arrastra y suelta tu archivo <b>socios.csv</b> aquí</p>
                <p class="text-sm">o</p>
                <label for="file-input" class="btn btn-primary">Seleccionar Archivo</label>
                <input type="file" id="file-input" accept=".csv" hidden>
            </div>

            <!-- Panel de Muestra de Resultados y Estadísticas -->
            <div id="results" class="results hidden">
                <h2>Resumen de Validación</h2>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total procesados</h3>
                        <p id="total-count" class="number">0</p>
                    </div>
                    <div class="stat-card valid">
                        <h3>Correctos</h3>
                        <p id="valid-count" class="number">0</p>
                    </div>
                    <div class="stat-card invalid">
                        <h3>Incorrectos</h3>
                        <p id="invalid-count" class="number">0</p>
                    </div>
                </div>

                <div class="actions">
                    <a id="download-valid" class="btn btn-success disabled">📥 Descargar Válidos</a>
                    <a id="download-invalid" class="btn btn-danger disabled">📥 Descargar Inválidos</a>
                </div>
                
                <button id="reset-btn" class="btn btn-secondary mt-4">Validar otro archivo</button>
            </div>
        </main>
    </div>

    <!-- Script adaptado para funcionar en las APIs del Navegador (Frontend) -->
    <script src="app.js"></script>
</body>
</html>
